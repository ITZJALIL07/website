<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let’s Build Your Website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#040a1f;--tx:#e8f0ff;--mu:#9db2d9;--cy:#22d3ee;--bl:#3b82f6;--pu:#a855f7;--g:linear-gradient(90deg,#22d3ee,#3b82f6 55%,#a855f7);--ln:rgba(96,165,250,.45);--gl:rgba(10,22,64,.6);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--tx);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;font-size:17px;line-height:1.7;background:radial-gradient(900px 500px at 15% -5%,rgba(37,99,235,.35),transparent 60%),radial-gradient(800px 500px at 100% 100%,rgba(124,58,237,.35),transparent 60%),var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0}
.brand{font-weight:800;font-size:20px}
.btn{font:inherit;font-weight:800;font-size:16px;border:0;border-radius:14px;padding:11px 26px;cursor:pointer;color:#04112b;background:var(--g);box-shadow:0 0 24px rgba(59,130,246,.5)}
.btn.o{background:transparent;color:var(--tx);border:1.5px solid var(--cy);box-shadow:none;padding:8px 20px}
.btn.gh{background:transparent;color:var(--mu);border:1px solid var(--ln);box-shadow:none}
.btn[hidden]{display:none}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;padding:20px 0 34px}
h1{font-size:clamp(38px,7vw,64px);line-height:1.2;font-weight:800;margin:0 0 14px}
.gr{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 0 20px;font-size:19px;max-width:28em}
.feats{display:flex;flex-wrap:wrap;gap:22px;margin-top:22px;font-size:15px;color:var(--mu)}
.feats span{display:flex;align-items:center;gap:10px}
.feats svg{width:34px;height:34px}
.art{width:100%;height:auto;filter:drop-shadow(0 0 30px rgba(59,130,246,.55))}
.panel{border:1.5px solid var(--ln);border-radius:24px;background:var(--gl);box-shadow:0 0 40px rgba(59,130,246,.25),inset 0 0 40px rgba(59,130,246,.08);padding:26px}
.ph{display:flex;align-items:center;gap:16px;justify-content:center;margin-bottom:22px;text-align:start}
.ph .ic{width:56px;height:56px;border:1.5px solid var(--cy);border-radius:14px;display:grid;place-items:center;font-size:26px}
.ph h2{margin:0;font-size:30px;font-weight:800;line-height:1.2}
.ph small{color:var(--mu);font-size:15px}
.steps{display:flex;margin-bottom:22px}
.st{flex:1;text-align:center;position:relative;font-size:14px;color:var(--mu);background:none;border:0;font-family:inherit;padding:0}
.st i{display:grid;place-items:center;width:38px;height:38px;margin:0 auto 6px;border-radius:50%;border:1.5px solid var(--ln);background:#0a1640;font-style:normal;font-weight:700;color:var(--tx);position:relative;z-index:1}
.st:not(:last-child)::before{content:"";position:absolute;top:18px;left:50%;right:-50%;height:2px;background:var(--ln)}
.st.d::before,.st.a::before{background:var(--cy)}
.st.d i{border-color:var(--cy);color:var(--cy)}
.st.a i{background:var(--g);color:#04112b;border-color:transparent;box-shadow:0 0 18px rgba(34,211,238,.7)}
.st.a{color:var(--tx);font-weight:700}
.body{display:grid;grid-template-columns:220px 1fr;gap:20px}
.side{border:1px solid var(--ln);border-radius:18px;background:rgba(15,30,90,.35);padding:22px 16px;text-align:center;align-self:stretch;display:flex;flex-direction:column;justify-content:center;align-items:center}
.side .big{font-size:54px;line-height:1.1;margin-bottom:10px}
.side b{font-size:20px}
.side p{color:var(--mu);font-size:15px;margin:6px 0 0}
.pane{border:1px solid var(--ln);border-radius:18px;padding:22px;min-width:0}
.pane h3{margin:0 0 16px;font-size:22px;font-weight:800}
.g{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fld.w{grid-column:1/-1}
.fld label{display:block;font-size:15px;font-weight:700;margin-bottom:6px}
.fld em{color:#f472b6;font-style:normal}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:rgba(6,14,48,.8);border:1px solid var(--ln);border-radius:10px;padding:11px 14px}
textarea{min-height:84px;resize:vertical}
input::placeholder,textarea::placeholder{color:#6f84b0}
input:focus,textarea:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px rgba(34,211,238,.2)}
.fld.bad input{border-color:#f472b6}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;color:var(--tx);background:rgba(6,14,48,.8);border:1px solid var(--ln);border-radius:999px;padding:6px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--g);color:#04112b;border-color:transparent;font-weight:700}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
.err{min-height:24px;margin-top:12px;color:#f9a8d4;font-size:15px}
.nv{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.thanks{text-align:center;padding:50px 0 60px}
.thanks svg{width:130px;height:130px;filter:drop-shadow(0 0 22px rgba(34,211,238,.7))}
.thanks h2{font-size:clamp(38px,8vw,60px);margin:10px 0;font-weight:800}
.thanks p{margin:0 auto 8px;max-width:30em;font-size:19px}
.wa{display:inline-flex;align-items:center;gap:10px;margin:22px 0 18px;background:linear-gradient(90deg,#22c55e,#16a34a 60%,#7c3aed);color:#fff;box-shadow:0 0 28px rgba(34,197,94,.45);padding:14px 34px;font-size:19px}
.back{display:block;background:none;border:0;color:var(--cy);font:inherit;text-decoration:underline;cursor:pointer;margin:0 auto}
[hidden]{display:none!important}
html[lang=en] body{font-family:"Poppins","Tajawal","Segoe UI",Arial,sans-serif}
.tel{direction:ltr}
html[lang=ar] :is(h1,.hero p,.feats b,.ph h2,.ph small,.fld,.pane h3,.side b,.side p,.err,.st span,.chip,.btn,.brand,.thanks h2,.thanks p,.back){direction:rtl}
html[lang=ar] .fld input,html[lang=ar] .fld textarea{direction:rtl;text-align:right}
html[lang=ar] .tel{direction:ltr;text-align:right}
body{overflow-x:hidden}
.feats b{font-weight:400}
.nr{display:flex;gap:10px;align-items:center}
@media (max-width:900px){
.hero{grid-template-columns:1fr;gap:10px;padding:8px 0 24px}
.art{max-width:340px;margin:0 auto}
.body{grid-template-columns:1fr}.side{display:none}
}
@media (max-width:640px){
body{font-size:16px}
.wrap{padding:0 10px}
.nav{padding:14px 6px}.brand{display:none}.nr{margin-left:auto}
.btn.o{padding:7px 14px;font-size:14px}
.hero{padding:6px 6px 20px}.art{display:none}
h1{font-size:36px;margin-bottom:10px}
.hero p{font-size:16px;margin-bottom:0}
.feats{flex-direction:column;gap:12px;margin-top:20px}
.feats svg{width:28px;height:28px}
.panel{padding:16px 10px;border-radius:18px}
.ph{margin-bottom:18px;gap:12px}.ph .ic{width:46px;height:46px;font-size:22px}.ph h2{font-size:22px}.ph small{font-size:14px}
.steps{margin-bottom:44px}
.st i{width:34px;height:34px;font-size:14px}.st:not(:last-child)::before{top:16px}
.st span{display:none}
.st.a span{display:block;position:absolute;top:42px;left:0;right:0;white-space:nowrap}
.pane{padding:0;border:0}.pane h3{font-size:20px;margin-bottom:14px}
.g{grid-template-columns:1fr;gap:20px}
textarea{min-height:76px}
.chip{padding:7px 14px}
.nv{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin:18px 0 0;padding:10px;border:1px solid var(--ln);border-radius:16px;background:rgba(4,10,31,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:3}
.nv .btn{flex:1;padding:12px 10px}
.thanks{padding:36px 6px 48px}.thanks svg{width:104px;height:104px}
.thanks p{font-size:17px}.wa{width:100%;justify-content:center;padding:14px 20px}
}
</style>
</head>

<div class="wrap">
<div id="main">
  <div class="nav"><span class="brand" data-k="brand"></span><span class="nr"><button class="btn o" id="lang" type="button">العربية</button><button class="btn o" id="go" type="button" data-k="go"></button></span></div>

  <section class="panel" id="brief" aria-label="ملف مشروع الموقع">
    <div class="ph"><div class="ic">📋</div><div><h2 data-k="ph"></h2><small data-k="pd"></small></div></div>
    <div class="steps" id="steps"></div>
    <div class="body">

        <div class="nv"><button class="btn gh" id="prev" type="button" data-k="prev"></button><button class="btn" id="next" type="button"></button></div>
      </div>
    </div>
  </section>
  <div style="height:60px"></div>
</div>

<section class="thanks" id="thanks" hidden>
  <svg viewBox="0 0 120 120" fill="none"><defs><linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs><circle cx="60" cy="60" r="52" stroke="url(#tg)" stroke-width="6"/><path d="m36 62 17 17 32-36" stroke="#2ee6a6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h2 data-k="ty"></h2>
  <p data-k="t1"></p>
  <p style="color:var(--mu)" data-k="t2"></p>
  <button class="btn wa" id="wa" type="button" data-k="wa"></button>
  <button class="back" id="home" type="button" data-k="home"></button>
</section>
</div>

 {t:"Budget & Time|الميزانية والوقت", i:"⏱️", h:"Budget & Time|الميزانية والوقت", d:"The last step before sending.|الخطوة الأخيرة قبل الإرسال.", f:[
  ["Budget for the website|الميزانية المخصصة للموقع","t","e.g. 60,000 DZD|مثال: 60,000 دج"],
  ["When do you need the site to be ready?|متى تريد أن يكون الموقع جاهزًا؟","t",""],
  ["Payment method|طريقة الدفع","c",["One payment|دفعة واحدة","Installments|على أقساط"]],
  ["Who will approve the design and content on your side?|من يعتمد التصميم والمحتوى من جهتك؟","t",""],
  ["How would you like to follow the progress?|كيف تفضّل متابعة سير العمل؟","c",["Messages|رسائل","Weekly calls|مكالمات أسبوعية"]],
  ["Other notes|ملاحظات أخرى","a",""]]}
];

var $ = function (id) { return document.getElementById(id); };
var key = function (s, f) { return "s" + s + "f" + f; };
var L = function (s) { return s.split("|")[lang === "ar" ? 1 : 0] || ""; };
var A = function (s) { return s.split("|")[1] || s; };
var esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); };

function buildSteps() {
  $("steps").innerHTML = ST.map(function (s, i) {
    return '<button class="st" type="button" data-i="' + i + '"><i>' + (i + 1) + '</i><span>' + L(s.t) + '</span></button>';
  }).join("");
}

function nextLabel() { return L(cur === ST.length - 1 ? UI.snd : UI.nxt); }

function render() {
  var s = ST[cur], h = '<h3>' + (cur + 1) + '. ' + L(s.t) + '</h3><div class="g">';
  s.f.forEach(function (f, fi) {
    var id = key(cur, fi), ty = f[1], v = V[id];
    var wide = (ty === "a" || ty === "c" || ty === "m") ? " w" : "";
    var ph = Array.isArray(f[2]) ? "" : esc(L(f[2] || ""));
    h += '<div class="fld' + wide + '" id="w' + id + '"><label for="' + id + '">' + L(f[0]) + (f[3] ? ' <em>*</em>' : '') + '</label>';
    if (ty === "a") h += '<textarea id="' + id + '" placeholder="' + ph + '">' + esc(v || "") + '</textarea>';
    else if (ty === "c" || ty === "m") {
      h += '<div class="chips" id="' + id + '">';
      f[2].forEach(function (o) {
        var on = ty === "m" ? (v || []).indexOf(o) > -1 : v === o;
        h += '<button type="button" class="chip" aria-pressed="' + on + '" data-id="' + id + '" data-ty="' + ty + '" data-v="' + esc(o) + '">' + L(o) + '</button>';
      });
      h += '</div>';
    } else {
      h += '<input id="' + id + '" type="' + (ty === "p" ? "tel" : ty === "e" ? "email" : "text") + '" placeholder="' + ph + '" value="' + esc(v || "") + '"' + (ty === "p" ? ' class="tel" inputmode="tel"' : '') + '>';
    }
    h += '</div>';
  });
  $("pane").innerHTML = h + '</div>';
  $("err").textContent = "";
  $("sicon").textContent = s.i; $("stitle").textContent = L(s.h); $("sdesc").textContent = L(s.d);
  document.querySelectorAll(".st").forEach(function (b, i) {
    b.className = "st" + (i < cur ? " d" : i === cur ? " a" : "");
  });
  $("prev").hidden = cur === 0;
  $("next").textContent = nextLabel();
}

// The layout never flips: only the text direction changes with the language.
function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.title = L(UI.tt);
  document.querySelectorAll("[data-k]").forEach(function (e) { e.innerHTML = L(UI[e.dataset.k]); });
  $("lang").textContent = l === "en" ? "العربية" : "English";
  buildSteps(); render();
}

$("pane").addEventListener("input", function (e) { V[e.target.id] = e.target.value; });
$("pane").addEventListener("click", function (e) {
  var b = e.target.closest(".chip");
  if (!b) return;
  var id = b.dataset.id, v = b.dataset.v, m = b.dataset.ty === "m";
  if (m) {
    var a = V[id] || [], at = a.indexOf(v);
    if (at > -1) a.splice(at, 1); else a.push(v);
    V[id] = a;
  } else V[id] = V[id] === v ? "" : v;
  $(id).querySelectorAll(".chip").forEach(function (c) {
    c.setAttribute("aria-pressed", m ? V[id].indexOf(c.dataset.v) > -1 : V[id] === c.dataset.v);
  });
});
$("steps").addEventListener("click", function (e) {
  var b = e.target.closest(".st");
  if (b && +b.dataset.i < cur) { cur = +b.dataset.i; render(); }
});

function valid() {
  if (cur !== 0) return true;
  var name = (V[key(0, 0)] || "").trim(), ph = (V[key(0, 2)] || "").replace(/\D/g, "");
  var bad = null;
  if (ph.length < 8) bad = key(0, 2);
  if (!name) bad = key(0, 0);
  if (bad) {
    $("w" + bad).classList.add("bad"); $(bad).focus();
    $("err").textContent = L(UI.err);
    return false;
  }
  return true;
}

// The email is always written in Arabic so it reads the same whichever language the client used.
function message() {
  var o = "طلب موقع جديد\n";
  ST.forEach(function (s, si) {
    var l = "";
    s.f.forEach(function (f, fi) {
      var v = V[key(si, fi)];
      v = Array.isArray(v) ? v.map(A).join("، ") : (f[1] === "c" ? A(v || "") : (v || "").trim());
      if (v) l += "• " + A(f[0]).replace(" (اختياري)", "") + ": " + v + "\n";
    });
    if (l) o += "\n" + (si + 1) + ". " + A(s.t) + "\n" + l;
  });
  return o;
}

function sendEmail() {
  if (!EMAIL) {
    var configError = new Error("The recipient email is not configured");
    configError.code = "not-configured";
    return Promise.reject(configError);
  }
  var name = (V[key(0, 0)] || "").trim(), em = (V[key(0, 3)] || "").trim();
  var body = {_subject: "New website project brief – " + name, _template: "box", _captcha: "false", _honey: "",
    name: name, phone: (V[key(0, 2)] || "").trim(), message: message()};
  if (em) body.email = em;
  return fetch("https://formsubmit.co/ajax/" + EMAIL, {
    method: "POST", headers: {"Content-Type": "application/json", "Accept": "application/json"}, body: JSON.stringify(body)
  }).then(function (r) {
    return r.text().then(function (text) {
      var d = null;
      try { d = text ? JSON.parse(text) : null; } catch (parseError) { d = null; }
      if (!r.ok) {
        var httpError = new Error("FormSubmit returned HTTP " + r.status);
        httpError.code = "rejected";
        httpError.status = r.status;
        throw httpError;
      }
      if (!d || String(d.success).toLowerCase() !== "true") {
        var responseError = new Error("FormSubmit rejected the request");
        responseError.code = d ? "rejected" : "bad-response";
        throw responseError;
      }
    });
  }, function (error) {
    var networkError = new Error("Could not reach FormSubmit");
    networkError.code = "network";
    throw networkError;
  });
}

function submissionError(error) {
  if (error && error.code === "not-configured") return L(UI.notConfigured);
  if (error && error.code === "rejected") {
    return L(UI.fail) + (error.status ? " (HTTP " + error.status + ")" : "");
  }
  if (error && error.code === "bad-response") return L(UI.badResponse);
  if (error && error.code === "network") return L(UI.network);
  return L(UI.otherError);
}

$("prev").onclick = function () { if (cur > 0) { cur--; render(); } };
$("next").onclick = function () {
  if (sending || !valid()) return;
  if (cur < ST.length - 1) { cur++; render(); $("brief").scrollIntoView(); return; }
  sending = true; $("next").disabled = true; $("next").textContent = L(UI.sending); $("err").textContent = "";
  sendEmail().then(function () {
    $("main").hidden = true; $("thanks").hidden = false; window.scrollTo(0, 0);
  }).catch(function (error) {
    $("err").textContent = submissionError(error);
  }).then(function () {
    sending = false; $("next").disabled = false; $("next").textContent = nextLabel();
  });
};
$("wa").onclick = function () {
  window.open("https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(L(UI.hello)), "_blank", "noopener");
};
$("go").onclick = function () { $("brief").scrollIntoView({behavior: "smooth"}); };
$("lang").onclick = function () { setLang(lang === "en" ? "ar" : "en"); };
$("home").onclick = function () {
  V = {}; cur = 0; render();
  $("thanks").hidden = true; $("main").hidden = false; window.scrollTo(0, 0);
};
setLang("en");
</script>
</body>
</html>
